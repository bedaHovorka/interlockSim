# gradle.properties
#
# Gradle build properties for interlockSim project
# Migrated from Apache Ant + Ivy build system in 2026

# Project metadata
version=1.0
group=cz.vutbr.fit

# Java version (Java 21 LTS - migrated from Java 11 in 2026)
javaVersion=21

# Kotlin version (bumped 2026-07 to pick up Gradle 8.12/10-readiness fixes in the
# Kotlin Native Gradle plugin's KotlinNativeLink task machinery)
kotlinVersion=2.3.20

# Dependency versions (updated for Java 21 compatibility)
kdiscoVersion=0.6.0
slf4jVersion=2.0.17
# Logback 1.5.37 — latest 1.5.x release (2026-06-26). Covers CVE-2026-1225
# (fixed since 1.5.25, 2026-01-17) and CVE-2026-13006 (fixed in 1.5.37 itself).
# 1.5.25 is the minimum sufficient version for CVE-2026-1225 alone; 1.5.37 is
# bumped here as the current latest patch release.
logbackVersion=1.5.37
kotlinLoggingVersion=7.0.3
junitPlatformVersion=1.11.4
junitJupiterVersion=5.11.4
assertkVersion=0.28.1
mockkVersion=1.13.14
koinVersion=3.5.6
coroutinesVersion=1.10.1
xmlutilVersion=0.91.0
kotlinxIoVersion=0.5.4
# Koog: LLM agent framework for SP1 (Goal 10 dispatcher agent runtime)
# 1.0.0: First stable release with tool calling, OllamaModels curated set
koogVersion=1.0.0
# kotlinx.serialization: used by SP3.2 vocab and SP3.3 proto packages
# Version aligned with the transitive dep brought in by koog-agents 1.0.0
serializationVersion=1.10.0
# Burst/Mokkery are Kotlin compiler plugins with strict per-Kotlin-version
# compatibility; these versions must track kotlinVersion=2.3.20 above.
burstVersion=2.12.2
mokkeryVersion=3.3.0
jmhVersion=1.37
ktlintPluginVersion=13.1.0
detektPluginVersion=1.23.8
ktlintVersion=1.6.0

# @RepeatedTest repetition caps (Issue #714). Enforced on each Test task via
# the junit.jupiter.params.repeat.maxCount system property.
testRepeatMaxCount=50
heavyTestRepeatMaxCount=1000

# Gradle daemon and parallel build settings
# Enable daemon for faster builds (starts Gradle process once, reuses it)
org.gradle.daemon=true

# Enable parallel project execution (not applicable for single-project build, but future-proof)
org.gradle.parallel=true

# Enable build caching for faster incremental builds
org.gradle.caching=true

# JVM arguments for Gradle daemon
# Increased memory for compilation and testing
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build settings
# Show all warnings during build
org.gradle.warning.mode=all

# Console output mode (plain for CI/CD compatibility)
org.gradle.console=plain

# Gradle system properties
# Use UTF-8 for Gradle itself (Java sources use ISO-8859-1 via compiler options)
systemProp.file.encoding=UTF-8

# Improve IDEA import performance
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
atomicfuVersion=0.26.0
