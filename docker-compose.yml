#
#      Brno University of Technology
#      Faculty of Information Technology
#
#      BSc Thesis       2006/2007
#
#      Railway Interlocking Simulator
#
#      Dockerization: 2025
#      Optimized: 2026-01 (BuildKit cache mounts)
#      Security fix: 2026-06 (BuildKit secrets for GitHub Packages token)
#
#      Docker Compose orchestration for interlockSim project
#
#      Usage:
#        # Build services:
#        docker compose build app        # Build app (no tests; kDisco from GitHub Packages)
#        docker compose build text       # Build LaTeX thesis
#
#        # Run test suite (separate from app image build; tests execute
#        # DURING the image build -- there is no runtime test entry point):
#        docker compose --profile test build test
#
#        # Run GUI editor (requires X11):
#        docker compose up app
#
#        # Run simulation with example:
#        docker compose run app java -jar interlockSim.jar example shuntingLoop 60
#
#        # Run simulation with custom XML:
#        docker compose run -v $(pwd)/myfile.xml:/app/myfile.xml app java -jar interlockSim.jar sim myfile.xml
#
#      GitHub Packages authentication:
#        Set GITHUB_ACTOR and GITHUB_TOKEN and EXPORT them before building. The
#        token is passed to the build as a BuildKit secret (secrets.environment
#        below) so it never appears in the resolved RUN command, image layers, or
#        docker history. Because the secret provider reads the *process* env (not
#        .env, which compose only auto-loads for ${VAR} interpolation), a .env
#        file alone is NOT enough -- export it first:
#
#            set -a; source .env; set +a
#            docker compose up --build
#
#        A non-exported .env yields an empty token and a 401 from GitHub Packages.
#

services:
  # Build and run Java application with GUI support
  # kDisco is automatically downloaded from GitHub Packages or uses local Maven cache
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Match the host user's UID/GID so the container can read the 0600
        # X11 auth cookie and write artifacts with host-user ownership.
        # Set in .env or export before building:
        #   export RUNTIME_UID=$(id -u) RUNTIME_GID=$(id -g)
        RUNTIME_UID: ${RUNTIME_UID:-1000}
        RUNTIME_GID: ${RUNTIME_GID:-1000}
      secrets:
        # GitHub Packages credentials for kDisco dependency.
        # Values are read from host environment variables and mounted as BuildKit
        # secrets at /run/secrets/github_actor and /run/secrets/github_token.
        - github_actor
        - github_token
    image: interlocksim:latest
    environment:
      # Pass host DISPLAY to container for X11 forwarding
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      # Pass X11 authentication
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      # Mount X11 socket for GUI display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount X11 authentication file
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.docker.xauth:ro
      # Mount local directory to extract artifacts
      - ./artifacts/app:/artifacts
      # Optional: mount XML files for simulation
      # - ./src/main/resources:/app/xml:ro
    network_mode: host
    container_name: interlocksim-app
    # Allow X11 forwarding
    security_opt:
      - seccomp:unconfined
    # Optional: uncomment to keep container running for debugging
    # stdin_open: true
    # tty: true

  # Run the full test suite in a dedicated image build (separate from the app image).
  # Tests and quality gates execute DURING `build` -- BuildKit cache mounts and
  # secrets only exist at build time, so there is no runtime test entry point.
  # Tests run as the non-root `builder` user so filesystem-permission tests work.
  # This service is gated behind the "test" profile so it is never built or started
  # by a plain `docker compose up` or `docker compose up --build`.
  #
  # Usage:
  #   docker compose --profile test build test   # Runs tests; fails if the suite fails
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runner
      secrets:
        - github_actor
        - github_token
    image: interlocksim-test:latest
    container_name: interlocksim-test

  # Native fast-sim CLI binary (no JVM, minimal image)
  # Usage:
  #   docker compose build fast-sim
  #   docker compose run fast-sim example shuntingLoop 60
  fast-sim:
    build:
      context: .
      dockerfile: Dockerfile.fast-sim
      secrets:
        # GitHub Packages credentials for kDisco dependency (see app service above).
        - github_actor
        - github_token
    image: interlocksim-fast-sim:latest
    container_name: interlocksim-fast-sim
    command: ["example", "shuntingLoop", "60"]

  # Local Ollama LLM server for dispatcher-agent's SP1.5 executor (Issue #550) and proof-of-connection
  # testing (@Tag("ollama-test")). This is an ALTERNATIVE to a native Ollama install, not a
  # companion to one -- both would bind port 11434.
  #
  # ollama-port-check is a one-shot container that probes localhost:11434 via
  # `nc -z` using network_mode: host (direct access to the real host's network stack on
  # Linux). If something is already listening there, it exits 1, which -- via ollama's
  # depends_on condition: service_completed_successfully below -- prevents the ollama
  # container from starting at all. This means `docker compose up -d ollama` is safe to
  # run unconditionally: it no-ops if a local Ollama (native or another container) is
  # already up, and starts the container otherwise.
  #
  # KNOWN LIMITATION (Windows/macOS Docker Desktop): network_mode: host runs inside the
  # Docker Desktop VM (WSL2 on Windows), not the real host OS, so it cannot see a native
  # `ollama serve` process running directly on Windows/macOS outside of Docker. On those
  # platforms this check effectively only detects other Docker containers already
  # holding the port, not a native install -- no worse than the pre-existing manual
  # coordination, just not improved for that specific case.
  #
  # VERIFIED 2026-07-19 (Windows 11 + Docker Desktop 29.5.3, WSL2 backend, Issue #770):
  # a `network_mode: host` container genuinely cannot reach `localhost:11434` when Ollama
  # is a native Windows install (confirmed with `docker run --rm --network host busybox
  # nc -zv localhost 11434` against a running native `ollama serve` -- connection failed).
  # `host.docker.internal:11434` IS reachable from a `network_mode: host` container on the
  # same setup, which is why dispatcher-agent's OLLAMA_BASE_URL (see OllamaExecutorConfig
  # and docs/SP1_5_OLLAMA_EXECUTOR_SETUP.md) should be set to
  # `http://host.docker.internal:11434` once Stage B wires it into the `app` service below --
  # `app` already runs with `network_mode: host` and that works without changing it.
  #
  # GPU support: Ollama auto-detects the GPU at runtime -- there are NO `OLLAMA_CUDA` /
  # `OLLAMA_ROCM` environment variables (those are not real Ollama knobs). To give the
  # container GPU access, uncomment the `deploy.resources.reservations.devices` block below
  # (NVIDIA) and have `nvidia-container-toolkit` installed + the Docker runtime configured:
  #     sudo dnf install nvidia-container-toolkit
  #     sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
  # Ollama then uses CUDA automatically. To FORCE a specific backend (optional), set
  # `OLLAMA_LLM_LIBRARY=cuda_v11` (NVIDIA) or `rocm_v6` (AMD) in the environment section below;
  # for AMD ROCm use the `ollama/ollama:rocm` image instead of `ollama/ollama:latest`.
  # CPU-only (default, no device block uncommented) runs on any machine.
  #
  # VRAM limit: Set `OLLAMA_MAX_VRAM` (in BYTES, not "8GB") to cap VRAM (max 8GB per @bedaHovorka):
  #   export OLLAMA_MAX_VRAM=8589934592   # 8 GiB exactly (8 * 1024^3)
  # OLLAMA_MAX_VRAM is a real Ollama env var; 0 means unlimited.
  #
  # On startup, pulls qwen2.5:7b-instruct only if it isn't already present in the
  # ollama-data volume (so restarts after the first run don't re-pull ~4.7GB).
  #
  # Usage:
  #   # CPU-only (default, slowest but works everywhere)
  #   docker compose up -d ollama
  #
  #   # GPU with CUDA (fast, requires NVIDIA GPU + nvidia-container-toolkit)
  #   #   1. Uncomment the deploy.resources.reservations.devices block below.
  #   #   2. export OLLAMA_MAX_VRAM=8589934592   # optional 8GB VRAM cap
  #   docker compose up -d ollama
  #
  #   # Then run integrationTest which auto-detects localhost:11434, no config needed
  #   ./gradlew :dispatcher-agent:integrationTest
  ollama-port-check:
    image: busybox:latest
    container_name: interlocksim-ollama-port-check
    network_mode: host
    command:
      - sh
      - -c
      - |
        if nc -z localhost 11434 2>/dev/null; then
          echo "Port 11434 already in use -- assuming a local Ollama is already running. Skipping container start."
          exit 1
        fi
        echo "Port 11434 is free -- proceeding to start the Ollama container."

  ollama:
    image: ollama/ollama:latest
    container_name: interlocksim-ollama
    depends_on:
      ollama-port-check:
        condition: service_completed_successfully
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # OLLAMA_MAX_VRAM (real Ollama env var, in BYTES): 0 = unlimited; set to
      # 8589934592 for an 8GB VRAM cap. Note: OLLAMA_CUDA / OLLAMA_ROCM are NOT real Ollama
      # variables -- Ollama auto-detects the GPU; use the device block below for GPU access.
      OLLAMA_MAX_VRAM: ${OLLAMA_MAX_VRAM:-0}
      # OLLAMA_NUM_PARALLEL=1     # Serialize model loading on low-VRAM systems
      # OLLAMA_LLM_LIBRARY=cuda_v11   # Force CUDA backend (NVIDIA); rocm_v6 for AMD. Optional.
    # GPU support (NVIDIA): uncomment to give the container GPU access. Requires
    # nvidia-container-toolkit installed and the Docker runtime configured (see comment
    # block above). Ollama then auto-detects CUDA -- no env var needed. For AMD, switch the
    # image to ollama/ollama:rocm and use driver: amd / OLLAMA_LLM_LIBRARY=rocm_v6.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama list | grep -q "qwen2.5:7b-instruct" || ollama pull qwen2.5:7b-instruct
        wait

  # Build LaTeX thesis with Czech language tools
  text:
    build:
      context: .
      dockerfile: text/Dockerfile
    image: interlocksim-text:latest
    volumes:
      # Mount local directory to extract artifacts
      - ./artifacts/text:/artifacts
    container_name: interlocksim-text-build
    # Optional: uncomment to see more detailed build output
    # stdin_open: true
    # tty: true

# Explicit network for clarity (optional)
networks:
  default:
    name: interlocksim-network

# BuildKit secrets: map host environment variables to secret IDs used in Dockerfiles.
# The values are mounted at runtime and are not persisted in the image.
secrets:
  github_actor:
    environment: GITHUB_ACTOR
  github_token:
    environment: GITHUB_TOKEN

# Note: BuildKit cache mounts are managed in Dockerfiles, not here
# ollama-data persists pulled models across `docker compose down`/`up` cycles.
volumes:
  ollama-data:
