# Committed dispatcher defaults (Issue #834, SP2c.11).
#
# This file is the middle tier of the dispatcher's configuration precedence chain:
#
#     JVM system property (-Dinterlocksim.dispatcher.*)  >  this file  >  code fallback constant
#
# It exists so a chosen default can be *committed* (edited here, reviewed in a diff, cited in a
# commit body) instead of hardcoded as a Kotlin `const val` that requires a recompile. The sweep
# driver (`aiSweep`, see CLAUDE.md "Manual-only dispatcher sweep") still overrides any of these
# per forked run with a `-D` flag, unchanged by this file's existence — see
# DispatcherRunConfig.fromProperties and OllamaExecutorConfig.default.
#
# Key names are identical to the -D system property names on purpose: there is exactly one
# vocabulary to learn (DispatcherRunConfig.PREFIX = "interlocksim.dispatcher.").
#
# A missing, unreadable, or malformed value here is a WARN, never a build/run failure — see
# DispatcherDefaultsResource's KDoc. An unrecognized key is ignored (logged at WARN as a likely
# typo, never rejected outright, so this file stays forward-compatible with a not-yet-wired knob).
#
# IMPORTANT: as of this task (#834 Task 6), every value below reproduces the pre-existing Kotlin
# `const val` exactly — no default's value has changed. The sweep's chosen values are committed
# here later, by editing this file (#834 Task 14), with the sweep evidence cited in that commit's
# body.

# Minimum wall-clock spacing (milliseconds) between AgentLoopDriver cycles. 0 = "as fast as the
# snapshot signal allows" (see DispatcherRunConfig.tickPeriodMs KDoc for why 0 is deliberate, not
# merely "unset"). Source: DispatcherRunConfig.DEFAULT_TICK_PERIOD_MS (pre-#834 compiled default).
interlocksim.dispatcher.tickPeriodMs=0

# Capacity of the per-cycle history block rendered into the LLM prompt (TickRingBuffer). Source:
# DispatcherRunConfig.DEFAULT_HISTORY_N (pre-#834 compiled default, matches "N = 3 to start", C5).
interlocksim.dispatcher.historyN=3

# Cap on non-NoOp actuator emissions accepted per agent cycle (SinkHolder). Source:
# DispatcherRunConfig.DEFAULT_MAX_ACTIONS_PER_TICK (pre-#834 compiled default, matches ActionValidator
# and Sec. 5.5's "0-3 actions per step").
interlocksim.dispatcher.maxActionsPerTick=3

# Maximum wall-clock seconds a single LLM cycle may take before KoogAgentPlanAdapter falls back to
# the rule-based dispatcher for that cycle. Source:
# DispatcherRunConfig.DEFAULT_INFERENCE_TIMEOUT_SECONDS (pre-#834 compiled default; the
# traffic-simulation-expert + agent-architect ruling on Issue #893 keeps the production default at
# 30s -- a longer budget such as 90s is a grid-only measurement value, never shipped here).
interlocksim.dispatcher.inferenceTimeoutSeconds=30

# Ollama model tag used by OllamaExecutorConfig when DispatcherRunConfig.model is not overridden by
# a -D flag. Source: OllamaExecutorConfig.DEFAULT_MODEL_NAME (pre-#834 compiled default; chosen per
# docs/GOAL_10_SP3_1_LLM_MODEL_EVALUATION.md).
interlocksim.dispatcher.model=qwen2.5:7b-instruct

# Ollama sampling temperature used by OllamaExecutorConfig when DispatcherRunConfig.temperature is
# not overridden by a -D flag. Source: OllamaExecutorConfig.DEFAULT_TEMPERATURE (pre-#834 compiled
# default; see OllamaExecutorConfig.temperature KDoc for the tool-calling-correctness rationale --
# this value is deliberately not chosen for reproducibility).
interlocksim.dispatcher.temperature=0.28

# Which revision of the DISPATCHER system prompt KoogAgentFactory assembles: BASELINE (the prompt
# PR #896 shipped) or REVISED (the #834 revision -- same guarded properties, fewer tokens, explicit
# empty-station idle path). Source: PromptVariant.DEFAULT (BASELINE). This is an A/B axis, not a
# preference: nothing claims REVISED is better until the sweep measures it, so the committed default
# stays BASELINE and the sweep grid selects the other arm per forked run. An unrecognized name here
# is a WARN and falls back to BASELINE, never a failed run -- see DispatcherRunConfig.promptVariant.
interlocksim.dispatcher.promptVariant=BASELINE
