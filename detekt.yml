  NoUnusedImports:
    active: true
  NoWildcardImports:
    active: false  # Allow wildcard imports (legacy)
  NullableTypeSpacing:
    active: false
  PackageName:
    active: true
  ParameterListSpacing:
    active: false
  ParameterListWrapping:
    active: false
  ParameterWrapping:
    active: false
  PropertyName:
